repos:
  - repo: local
    hooks:
      - id: build
        name: Build
        entry: make build
        language: system
        pass_filenames: false
      - id: lint
        name: Lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: test
        name: Test
        entry: make test
        language: system
        pass_filenames: false